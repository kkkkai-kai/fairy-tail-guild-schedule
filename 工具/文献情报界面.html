<header><div><h1>✦ 公会文献情报站</h1><small>真实研究线索 · 情报角呈递 · 研读角归档</small></div><button id="update" class="primary">更新文献情报</button></header>

<nav><button data-view="intel">情报角</button><button data-view="library">研读角收藏</button><button data-view="research">研究卷宗</button></nav>
<div id="delivery" class="delivery" hidden></div><p id="source-status" class="warning" hidden></p><div id="message" role="status" aria-live="polite"></div>
<div class="filters"><input id="query" type="search" aria-label="搜索文献与研究札记" placeholder="搜索中英题名、DOI、笔记或图号"><select id="topic" aria-label="文献主题"><option value="">全部主题</option value="sg">应激颗粒</option><option value="zn">应激与Zn离子</option><option value="cross">应激颗粒与Zn交叉</option><option value="canine">犬CAR-T</option><option value="other">待分类</option></select><select id="status" aria-label="研读状态"><option value="">全部研读状态</option><option value="unread">未读</option><option value="reading">研读中</option><option value="read">已读</option></select><select id="archive" aria-label="归档分组"><option value="">全部归档状态</option><option>待获取全文</option><option>待研读</option><option>研读中</option><option>已整理</option></select><label id="all-label"><input type="checkbox" id="all">查看全部候选</label></div>
<div class="workbench"><aside id="queue" class="queue" aria-label="来访卷宗"></aside><main id="list"></main></div>
<details class="settings"><summary>本地资料管理与期刊指标</summary><p id="root"></p><p><label><input type="checkbox" id="auto">收藏后尝试下载公开合法 PDF</label> <button id="ris">导出收藏 RIS</button></p>
<p>三套分区独立记录；年度和来源必须核验，不按影响因子推算。</p>
<p><label><input type="checkbox" id="auto-publication">打开本地研读库时温和核对出版更新</label><small> 每篇成功核对后7天再查，失败后至少等1天；每次最多3篇，不自动修改论文或笔记。</small></p>
<form id="metric"><div class="metric-grid"><input name="journal" placeholder="期刊完整名称" required><input name="issn" placeholder="ISSN（可选）"><input name="year" type="number" min="2000" placeholder="JIF 指标年度" required><input name="value" type="number" min="0" step="any" placeholder="已核验 JIF（可选）"><input name="sourceUrl" type="url" placeholder="JIF 来源 HTTPS"></div><p><label><input name="confirmed" type="checkbox" required>我已核对指标年度、JIF 数值及来源（不是其他指标）</label> <button>保存指标</button></p></form>
<details><summary>导入其他 AI 的文献记录</summary><p>先预览再导入；保留中英文完整题名、DOI与可核验来源。重复记录不再次派送，外部记录先标待核验，不接受任意下载链接。</p><textarea id="import-json" class="notes" placeholder='[{"title":"完整原文题名","titleZh":"中文译名","doi":"10.…","sourceUrl":"https://…"}]'></textarea><p id="import-preview" role="status"></p><button id="import">预览导入</button></details></details>
